[project]
name = "ai4tju-guide"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "openai==3.13.0",
  "edge-tts==7.2.8", "langgraph==1.2.11",
  "pydantic-settings==2.15.0", "httpx==0.28.1"
]
[dependency-groups]
dev = ["pytest==9.1.1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
norecursedirs = [".worktrees", ".venv", ".tools", "node_modules", "dist"]
pythonpath = ["."]
